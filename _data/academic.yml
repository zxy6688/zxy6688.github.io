interests: Human–Computer Interaction (HCI) · Natural Language Processing (NLP) · Large Language Models (LLMs) ·
  Multi-Agent Systems · AI for Education · Blockchain & Distributed Systems Security
biography:
  - I am an undergraduate student majoring in Computer Science and Technology at Beijing Normal University.
  - Throughout my undergraduate studies, I have explored diverse areas of computer science and artificial intelligence,
    including blockchain and distributed systems security, natural language processing, large language models, multi-agent
    systems, and AI for education. These experiences have broadened my perspective and allowed me to engage with different
    research methodologies, from mathematical modeling and system evaluation to empirical experimentation.
  - Through these explorations, I have gradually developed a particular interest in <strong>Human–Computer Interaction
    (HCI)</strong>. I am especially interested in understanding how emerging AI technologies shape human behavior
    and social interactions. I am now pursuing HCI research more deeply, drawing on my interdisciplinary background
    to investigate meaningful questions at the intersection of humans and AI.
