interests: Human–Computer Interaction (HCI) · Natural Language Processing (NLP) · Large Language Models (LLMs) ·
  Multi-Agent Systems · AI for Education · Blockchain & Distributed Systems Security
biography:
  - I am an undergraduate student in Computer Science and Technology at Beijing Normal University.
    My research journey has taken me through blockchain and distributed systems security, natural language
    processing, large language models, multi-agent systems, and AI for education.
  - These experiences have gradually drawn me toward <strong>Human–Computer Interaction (HCI)</strong>.
    I am particularly interested in how emerging AI technologies shape human behavior and social interactions.
    Drawing on this interdisciplinary background, I am now pursuing HCI research more deeply, combining
    experience in system evaluation and empirical experimentation to explore questions at the intersection of humans and AI.
