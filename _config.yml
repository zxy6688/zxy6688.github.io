title: Xinyuan Zhou
first_name: Xinyuan
last_name: Zhou
description: >
  Xinyuan Zhou is an undergraduate researcher at Beijing Normal University, pursuing Human–Computer Interaction research with an interdisciplinary background in AI and computer science.
lang: en
url: https://zxy6688.github.io
baseurl: ""

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
include: ["_pages"]
exclude:
  - AGENTS.md
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - node_modules
  - vendor
keep_files: [".nojekyll"]
plugins:
  - jekyll-minifier
  - jekyll-sitemap
  - jekyll-link-attributes
jekyll-minifier:
  compress_javascript: false
  exclude: ["robots.txt"]
external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false
