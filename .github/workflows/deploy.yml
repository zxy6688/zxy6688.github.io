name: Deploy site
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Production build
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build
      - name: Check internal links and resources
        uses: lycheeverse/lychee-action@v2.0.2
        with:
          fail: true
          args: --offline --root-dir "${{ github.workspace }}/_site" --no-progress '_site/**/*.html'
      - name: Publish generated site
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          force: false
